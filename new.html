<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parth Career Guidance</title>
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f4c81,#3aa6ff);
}
.container{
max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
}
.logo{
text-align:center;
font-size:26px;
font-weight:bold;
color:#0f4c81;
}
.subtitle{
text-align:center;
color:#555;
margin-bottom:15px;
}
.question{
margin:15px 0;
}
label{
display:block;
padding:6px;
cursor:pointer;
}
input[type="text"]{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}
button{
width:100%;
padding:14px;
background:#0f4c81;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}
button:hover{background:#082c4c}
#result{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f0f7ff;
display:none;
}
img.banner{
width:100%;
border-radius:12px;
margin-bottom:15px;
}
@media(max-width:600px){
.container{margin:10px}
.logo{font-size:22px}
}
</style>
</head>
<body><div class="container">
<div class="logo">🎓 Parth Web App</div>
<div class="subtitle">Career Guidance & IQ Analysis</div><img class="banner" src="https://images.unsplash.com/photo-1523240795612-9a054b0db644"><div class="question">
<p>1. Your Interest</p>
<label><input type="radio" name="q1" value="tech"> Technology</label>
<label><input type="radio" name="q1" value="creative"> Creative</label>
<label><input type="radio" name="q1" value="business"> Business</label>
<label><input type="radio" name="q1" value="service"> Government</label>
</div><div class="question">
<p>2. Favourite Subject</p>
<label><input type="radio" name="q2" value="tech"> Maths / Computer</label>
<label><input type="radio" name="q2" value="creative"> Drawing</label>
<label><input type="radio" name="q2" value="business"> Commerce</label>
<label><input type="radio" name="q2" value="service"> GK</label>
</div><div class="question">
<p>3. IQ Question: 2,4,8,16 next?</p>
<label><input type="radio" name="q3" value="tech"> 32</label>
<label><input type="radio" name="q3" value="creative"> 18</label>
<label><input type="radio" name="q3" value="business"> 24</label>
<label><input type="radio" name="q3" value="service"> 20</label>
</div><div class="question">
<p>4. IQ Question: Odd one out</p>
<label><input type="radio" name="q4" value="tech"> Circle</label>
<label><input type="radio" name="q4" value="creative"> Square</label>
<label><input type="radio" name="q4" value="business"> Triangle</label>
<label><input type="radio" name="q4" value="service"> Apple</label>
</div><div class="question">
<p>5. Your Speciality</p>
<input type="text" id="speciality">
</div><div class="question">
<p>6. Your Achievement</p>
<input type="text" id="achievement">
</div><button onclick="analyseCareer()">Analyse Career</button>

<div id="result"></div>
</div><script>
function analyseCareer(){
let answers=document.querySelectorAll('input[type="radio"]:checked');
let tech=0,creative=0,business=0,service=0;
let iqScore=0;

answers.forEach(ans=>{
if(ans.value==="tech") tech++;
if(ans.value==="creative") creative++;
if(ans.value==="business") business++;
if(ans.value==="service") service++;
});

// IQ scoring
if(document.querySelector('input[name="q3"]:checked')?.value==="tech") iqScore++;
if(document.querySelector('input[name="q4"]:checked')?.value==="service") iqScore++;

let total=tech+creative+business+service;
let techP=Math.round((tech/total)*100);
let creativeP=Math.round((creative/total)*100);
let businessP=Math.round((business/total)*100);
let serviceP=Math.round((service/total)*100);

let speciality=document.getElementById("speciality").value;
let achievement=document.getElementById("achievement").value;
let result=document.getElementById("result");

let best="";
let better="";

if(tech>=creative && tech>=business && tech>=service){
best="Web Developer, Software Engineer, Data Analyst";
better="AI Engineer, Cyber Security";
}
else if(creative>=tech && creative>=business && creative>=service){
best="Graphic Designer, UI UX Designer";
better="Animator, Video Editor";
}
else if(business>=tech && business>=creative && business>=service){
best="Business Management, Marketing";
better="Entrepreneur, HR";
}
else{
best="UPSC, MPSC, Police";
better="Banking, SSC";
}

result.style.display="block";
result.innerHTML=
"<h3>Career Analysis Result</h3>"+
"<p><b>Tech:</b> "+techP+"% | <b>Creative:</b> "+creativeP+"% | <b>Business:</b> "+businessP+"% | <b>Govt:</b> "+serviceP+"%</p>"+
"<p><b>IQ Score:</b> "+iqScore+" / 2</p>"+
"<p><b>Speciality:</b> "+speciality+"</p>"+
"<p><b>Achievement:</b> "+achievement+"</p>"+
"<p><b>Best Career:</b> "+best+"</p>"+
"<p><b>Better Options:</b> "+better+"</p>";
}
</script></body>
</html>
